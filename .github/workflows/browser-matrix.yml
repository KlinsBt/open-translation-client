name: Browser compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "vite.browser.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-matrix.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm clean-install --progress=false
      - name: Install Chromium, Firefox, WebKit, and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run the complete browser suite in all supported engines
        run: npm run test:browser:matrix
